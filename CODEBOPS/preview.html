<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, sans-serif; background: #16225c; color: #fff; }
  h2 { font-weight: 800; letter-spacing: .5px; margin: 0 0 10px; }

  /* ============ SPLASH MOCK ============ */
  .splash {
    position: relative; height: 92vh; min-height: 560px; overflow: hidden;
    background: linear-gradient(180deg, #6fd2ff 0%, #45b1f7 34%, #2f8ef0 62%, #2e7ce6 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 7vh 16px 5vh;
  }
  .rays {
    position: absolute; left: 50%; top: 22%; width: 160vmax; height: 160vmax;
    transform: translate(-50%,-50%);
    background: repeating-conic-gradient(rgba(255,255,255,.15) 0 9deg, transparent 9deg 30deg);
    -webkit-mask-image: radial-gradient(closest-side, #000, rgba(0,0,0,.5) 45%, transparent 72%);
    mask-image: radial-gradient(closest-side, #000, rgba(0,0,0,.5) 45%, transparent 72%);
    animation: rays-spin 90s linear infinite; pointer-events: none;
  }
  @keyframes rays-spin { to { transform: translate(-50%,-50%) rotate(360deg); } }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; pointer-events: none; }
  .hill { position: absolute; border-radius: 50%; }
  .hill.a { left: -14%; bottom: -26%; width: 74%; height: 62%; background: radial-gradient(90% 90% at 50% 8%, #8ee06a, #57b344); }
  .hill.b { right: -16%; bottom: -30%; width: 82%; height: 68%; background: radial-gradient(90% 90% at 50% 8%, #7ed95e, #4aa83c); }

  /* Official logo, animated: drop-bounce → idle rock + glint sweep. Tap to replay. */
  .logo-art {
    position: relative; width: min(80vw, 620px); margin-bottom: auto; z-index: 2;
    filter: drop-shadow(0 10px 26px rgba(13,20,55,.42));
    animation: logo-drop .95s cubic-bezier(.34,1.56,.64,1) both .1s; cursor: pointer;
  }
  .logo-art svg { width: 100%; height: auto; display: block; transform-origin: 50% 60%; animation: logo-rock 3.4s ease-in-out infinite 1.2s; }
  .logo-art.replay svg { animation: logo-pop .6s cubic-bezier(.34,1.56,.64,1), logo-rock 3.4s ease-in-out infinite .6s; }
  @keyframes logo-drop {
    0% { opacity: 0; transform: translateY(-58vh) scale(.55) rotate(-7deg); }
    58% { opacity: 1; transform: translateY(3.5%) scale(1.07,.9) rotate(1.5deg); }
    80% { transform: translateY(-2%) scale(.97,1.05) rotate(-.6deg); }
    100% { transform: none; } }
  @keyframes logo-rock { 0%,100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg) translateY(-2.5%); } }
  @keyframes logo-pop { 0%{transform:scale(1)} 40%{transform:scale(1.14,.88)} 70%{transform:scale(.95,1.07)} 100%{transform:scale(1)} }

  .play {
    z-index: 2; border: 4px solid #17903a; border-radius: 999px; cursor: pointer;
    font-size: clamp(28px, 4vw, 44px); font-weight: 800; letter-spacing: 2px; color: #fff;
    background: linear-gradient(180deg, #7dee8e, #43d366 45%, #23ba4c 78%, #1da844);
    box-shadow: 0 9px 0 #157a33, 0 20px 38px rgba(13,20,55,.42), inset 0 3px 0 rgba(255,255,255,.5);
    padding: 18px 70px; position: relative; overflow: hidden;
    text-shadow: 0 2px 0 rgba(13,20,55,.35);
  }
  .play::before { content:''; position:absolute; left:6%; right:6%; top:7%; height:42%; border-radius:999px;
    background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,.06)); }
  .play:active { transform: translateY(6px); box-shadow: 0 2px 0 #157a33; }

  /* ============ CHARACTER TEST BENCH ============ */
  .bench { padding: 34px 20px 60px; max-width: 1100px; margin: 0 auto; }
  .bench p { color: #cdd8ff; }
  .stage-row { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; margin-top: 18px; }
  .char-box { background: rgba(13,20,55,.4); border: 3px solid rgba(255,255,255,.14); border-radius: 24px; padding: 20px; width: min(460px, 94vw); text-align: center; }
  .char-holder { height: 320px; display: flex; align-items: flex-end; justify-content: center; }
  .char-holder svg { height: 100%; width: auto; filter: drop-shadow(0 14px 18px rgba(13,20,55,.4)); }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .btns button {
    font: inherit; font-weight: 800; color: #fff; border: 2px solid rgba(255,255,255,.6); cursor: pointer;
    background: linear-gradient(180deg, #7fd4ff, #2e7ce6); border-radius: 999px; padding: 8px 16px;
    box-shadow: 0 4px 0 #1c55ab, inset 0 2px 0 rgba(255,255,255,.5);
  }
  .btns button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1c55ab; }
  .btns button.purple { background: linear-gradient(180deg, #c18cff, #8b4ddb); box-shadow: 0 4px 0 #5e2fa8, inset 0 2px 0 rgba(255,255,255,.5); }

  /* ---- game character-state CSS (mirrors src/styles/main.css) ---- */
  .char-svg .lid { display: block; transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); transition: transform .07s ease-in; }
  .char-svg.blink .lid { transform: scaleY(1.06); }
  .char-svg .shine { transition: transform .28s cubic-bezier(.22,1,.36,1); }
  .char-svg.look-left .shine { transform: translateX(-12px); }
  .char-svg.look-right .shine { transform: translateX(12px); }
  .char-svg.look-up .shine { transform: translateY(-12px); }
  .char-svg .star-eye { transform-box: fill-box; transform-origin: center; }
  .char-svg.excited .star-eye { display: block; animation: star-pop .5s cubic-bezier(.34,1.56,.64,1); }
  .char-svg.excited .shine { display: none; }
  @keyframes star-pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: scale(1); } }
  .char-svg.mouth-smile-on .mouth-open { display: none; }
  .char-svg.mouth-smile-on .mouth-smile { display: block; }
  .char-svg.surprised .mouth-open { display: none; }
  .char-svg.surprised .mouth-o { display: block; }
  .holder { display: inline-block; }
  .holder.hop svg { animation: hop .34s ease-in-out; }
  @keyframes hop { 0%,100% { transform: scale(1,1); } 35% { transform: scale(.96,1.07) translateY(-8%); } 75% { transform: scale(1.05,.93); } }
  .holder.bump svg { animation: bump .32s linear; }
  @keyframes bump { 25% { transform: translateX(-7px) rotate(-3deg); } 55% { transform: translateX(5px) rotate(2deg); } 80% { transform: translateX(-3px); } }
  .holder.celebrate svg { animation: cele .8s cubic-bezier(.34,1.56,.64,1) 2; }
  @keyframes cele { 40% { transform: translateY(-13%) scale(1.05,1.08); } 65% { transform: translateY(0) scale(1.06,.92); } }
  .holder.waving svg { animation: wave-all .55s ease-in-out 3; transform-origin: 50% 88%; }
  @keyframes wave-all { 30% { transform: rotate(-7deg) translateY(-2%); } 70% { transform: rotate(5deg); } }
  .holder.glitching svg {
    animation: jitter .14s steps(2) infinite;
    filter: drop-shadow(3px 0 0 rgba(83,237,247,.85)) drop-shadow(-3px 0 0 rgba(249,50,199,.85));
  }
  @keyframes jitter { 25% { transform: translate(-3px,1px) skewX(-2deg); } 50% { transform: translate(3px,-2px) skewX(2deg); } 75% { transform: translate(-2px,-1px); } }
  .frag { animation: frag-flick 4.5s steps(2) infinite; }
  .frag.f1 { animation-delay: .4s } .frag.f2 { animation-delay: .9s } .frag.f3 { animation-delay: 1.3s }
  .frag.f4 { animation-delay: 1.8s } .frag.f5 { animation-delay: 2.2s } .frag.f6 { animation-delay: 2.7s }
  .frag.f7 { animation-delay: 3.1s } .frag.f8 { animation-delay: 3.6s } .frag.f9 { animation-delay: 2s }
  .frag.f10 { animation-delay: 1s } .frag.f11 { animation-delay: 3s }
  .glitching .frag { animation-duration: .5s; }
  @keyframes frag-flick { 0%, 90% { opacity: 1; } 95% { opacity: .15; } 100% { opacity: 1; } }
</style>

<script>
  // Logo: tap to replay pop
  const logo = document.getElementById('logo');
  logo.addEventListener('pointerdown', () => {
    logo.classList.remove('replay'); void logo.offsetWidth; logo.classList.add('replay');
  });

  const holders = { zip: document.getElementById('zip-holder'), mixy: document.getElementById('mixy-holder') };
  const svgs = { zip: holders.zip.querySelector('svg'), mixy: holders.mixy.querySelector('svg') };

  // Ambient life on splash + bench: blink and glance forever
  for (const el of document.querySelectorAll('.char-svg')) {
    (function life(svg) {
      const blink = () => { svg.classList.add('blink'); setTimeout(() => svg.classList.remove('blink'), 150); setTimeout(blink, 1800 + Math.random() * 2600); };
      const glance = () => {
        svg.classList.remove('look-left','look-right','look-up');
        const pick = ['look-left','look-right','look-up',''][Math.floor(Math.random()*4)];
        if (pick) svg.classList.add(pick);
        setTimeout(glance, 3200 + Math.random() * 3600);
      };
      setTimeout(blink, 900 + Math.random()*1200); setTimeout(glance, 2200);
    })(el);
  }

  const face = (name, cls) => () => {
    const s = svgs[name];
    for (const c of ['mouth-smile-on','surprised','excited']) if (c !== cls) s.classList.remove(c);
    s.classList.toggle(cls);
  };
  const move = (name, cls, ms) => () => {
    const h = holders[name];
    h.classList.remove(cls); void h.offsetWidth; h.classList.add(cls);
    setTimeout(() => h.classList.remove(cls), ms);
  };
  const actions = [
    ['Blink', (n) => () => { svgs[n].classList.add('blink'); setTimeout(() => svgs[n].classList.remove('blink'), 150); }],
    ['Look &larr;', (n) => () => { svgs[n].classList.remove('look-right','look-up'); svgs[n].classList.toggle('look-left'); }],
    ['Look &rarr;', (n) => () => { svgs[n].classList.remove('look-left','look-up'); svgs[n].classList.toggle('look-right'); }],
    ['Smile', (n) => face(n, 'mouth-smile-on')],
    ['Surprised', (n) => face(n, 'surprised')],
    ['Star eyes', (n) => face(n, 'excited')],
    ['Wave', (n) => move(n, 'waving', 1800)],
    ['Hop', (n) => move(n, 'hop', 400)],
    ['Bump', (n) => move(n, 'bump', 380)],
    ['Celebrate', (n) => move(n, 'celebrate', 1700)],
  ];
  for (const bar of document.querySelectorAll('.btns')) {
    const name = bar.dataset.target;
    for (const [label, make] of actions) {
      const b = document.createElement('button');
      b.innerHTML = label; b.addEventListener('click', make(name)); bar.appendChild(b);
    }
    if (name === 'mixy') {
      const b = document.createElement('button');
      b.textContent = 'Glitch!'; b.className = 'purple';
      b.addEventListener('click', move('mixy', 'glitching', 1200));
      bar.appendChild(b);
    }
  }
</script>
</body>
</html>
