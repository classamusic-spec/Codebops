<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#16225c" />
    <meta name="description" content="CodeBops — Teach tiny helpers. Build big ideas. A playful coding adventure for ages 3–7." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <!-- iOS reads none of the manifest. Without these three, "Add to Home
         Screen" opens the app inside Safari chrome, so the address bar
         eats the top of the world and the toolbar sits over the deck. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CodeBops" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>CodeBops — Teach tiny helpers. Build big ideas.</title>
    <!-- Self-hosted, on purpose: a cross-origin stylesheet cannot be
         precached, so the offline shell used to open in system fonts, and
         the standalone single-file build had no type at all. It also
         means a child's device makes no third-party request to read a
         headline. Regenerate with `node scripts/fetch-fonts.mjs`. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
  </head>
  <body>
    <div id="app">
      <!-- Instant-paint loading screen (replaced by the app bootstrap) -->
      <div
        id="boot-loader"
        aria-hidden="true"
        style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(120% 90% at 50% 0%, #27398f 0%, #16225c 55%, #101a45 100%); color: #fff; font-family: 'Fredoka', 'Nunito', ui-rounded, 'Arial Rounded MT Bold', 'Segoe UI', Roboto, system-ui, sans-serif"
      >
        <div class="boot-logo">
          <span style="--c:#38b6ff">C</span><span style="--c:#7de08a">o</span><span style="--c:#ffd23e">d</span><span style="--c:#5ee8c7">e</span><span style="--c:#ff5fa2">B</span><span style="--c:#ff9f2e">o</span><span style="--c:#a06bff">p</span><span style="--c:#7de08a">s</span>
        </div>
        <div class="boot-tag">Teach tiny helpers. Build big ideas.</div>
        <div class="boot-bar"><div class="boot-bar-fill"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
