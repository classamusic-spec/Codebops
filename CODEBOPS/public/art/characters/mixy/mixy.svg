    <ellipse cx="384" cy="878" rx="36" ry="22" fill="#a866f5" stroke="#4a1a8c" stroke-width="10"/>
  </g>

  <!-- belly with glitch ring -->
  <g id="belly">
    <circle cx="328" cy="748" r="86" fill="#f7effc"/>
    <g fill="none" stroke="#7c3aed" stroke-width="24">
      <path d="M 372,712 A 57 57 0 1 0 380,770"/>
