    <rect x="366" y="756" width="22" height="22" fill="#7ed321"/>
    <rect x="292" y="694" width="18" height="18" fill="#f932c7"/>
    <rect x="352" y="700" width="16" height="16" fill="#53edf7"/>
    <rect x="298" y="784" width="16" height="16" fill="#7c3aed"/>
  </g>

  <!-- glitch fragments -->
  <g id="fragments">
    <rect class="frag f0" x="502" y="420" width="24" height="24" fill="#53edf7"/>
    <rect class="frag f1" x="530" y="452" width="18" height="18" fill="#f932c7"/>
    <rect class="frag f2" x="490" y="490" width="16" height="16" fill="#7ed321"/>
    <rect class="frag f3" x="148" y="490" width="20" height="20" fill="#53edf7"/>
    <rect class="frag f4" x="170" y="522" width="14" height="14" fill="#f932c7"/>
    <rect class="frag f5" x="452" y="368" width="16" height="16" fill="#c4b5fd"/>
    <rect class="frag f6" x="208" y="382" width="14" height="14" fill="#53edf7"/>
    <rect class="frag f7" x="238" y="620" width="18" height="18" fill="#7ed321"/>
    <rect class="frag f8" x="212" y="648" width="14" height="14" fill="#53edf7"/>
    <rect class="frag f9" x="262" y="668" width="14" height="14" fill="#f932c7"/>
    <rect class="frag f10" x="422" y="640" width="18" height="18" fill="#53edf7"/>
    <rect class="frag f11" x="448" y="668" width="14" height="14" fill="#7ed321"/>
    <rect class="frag f12" x="252" y="720" width="16" height="16" fill="#7c3aed"/>
    <rect class="frag f13" x="398" y="720" width="14" height="14" fill="#f932c7"/>
    <rect class="frag f14" x="270" y="830" width="16" height="16" fill="#7ed321"/>
    <rect class="frag f15" x="372" y="836" width="14" height="14" fill="#53edf7"/>
    <rect class="frag f16" x="322" y="230" width="16" height="16" fill="#53edf7"/>
    <rect class="frag f17" x="186" y="290" width="14" height="14" fill="#f932c7"/>
    <rect class="frag f18" x="472" y="300" width="16" height="16" fill="#7ed321"/>
    <rect class="frag f19" x="140" y="420" width="12" height="12" fill="#c4b5fd"/>
    <rect class="frag f20" x="510" y="540" width="16" height="16" fill="#f932c7"/>
    <rect class="frag f21" x="160" y="560" width="14" height="14" fill="#7ed321"/>
    <rect class="frag f22" x="300" y="606" width="12" height="12" fill="#53edf7"/>
    <rect class="frag f23" x="356" y="612" width="12" height="12" fill="#f932c7"/>
  </g>
</g>
</svg>
