    <ellipse class="lid" cx="416" cy="452" rx="63" ry="69" fill="#f7effc"/>
    <path class="star-eye" d="M 413,420 L 423,442 L 447,444 L 429,459 L 435,483 L 413,470 L 391,483 L 397,459 L 379,444 L 403,442 Z" fill="#ffd23e" stroke="#8c0a77" stroke-width="5"/>
  </g>

  <!-- mouth -->
  <g id="mouth">
    <g class="mouth-open">
      <path d="M 284,538 Q 328,528 372,538 C 375,582 353,605 328,605 C 303,605 281,582 284,538 Z" fill="#1d073e" stroke="#1d073e" stroke-width="6"/>
      <path d="M 298,584 Q 328,566 358,584 C 350,598 340,602 328,602 C 316,602 306,598 298,584 Z" fill="#ed3879"/>
    </g>
    <path class="mouth-smile" d="M 290,548 Q 328,582 366,548" fill="none" stroke="#1d073e" stroke-width="11"/>
    <g class="mouth-o">
      <ellipse cx="328" cy="562" rx="17" ry="20" fill="#1d073e"/>
      <ellipse cx="328" cy="569" rx="8.5" ry="9.5" fill="#ed3879"/>
    </g>
  </g>

  <!-- arms (paw-wings) -->
  <path d="M 248,676 C 202,664 158,672 128,694 C 108,708 108,726 126,732 C 116,743 126,757 146,755 C 140,769 154,779 173,771 C 202,759 230,738 249,716 C 263,700 266,681 248,676 Z"
