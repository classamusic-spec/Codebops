  <!-- body -->
  <g id="body">
    <path d="M 242,614 C 214,674 202,750 212,804 C 219,844 248,866 288,870 C 306,875 350,875 368,870 C 408,866 437,844 444,804 C 454,750 442,674 414,614 C 364,652 292,652 242,614 Z"
