<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 657 950" class="char-svg mixy"><style>.lid,.star-eye,.mouth-smile,.mouth-o{display:none}</style>
<g stroke-linejoin="round" stroke-linecap="round">
  <!-- left antenna: teardrop with cyan glossy cap -->
  <g id="antenna-left">
    <path d="M 208,300 C 176,262 140,196 126,140 C 116,102 126,64 158,48 C 190,32 226,48 240,88 C 260,144 264,222 258,272 L 232,296 Z"
          fill="#8b3ff0" stroke="#4a1a8c" stroke-width="13"/>
    <path d="M 127,144 C 116,104 126,64 158,48 C 190,32 226,48 240,88 C 247,108 252,130 255,152 L 210,148 L 206,172 L 156,166 L 152,146 Z"
          fill="#3fd8f5" stroke="#0e7fa8" stroke-width="12"/>
    <ellipse cx="162" cy="84" rx="26" ry="15" fill="#f7effc" transform="rotate(-24 162 84)"/>
  </g>

  <!-- right antenna: angular glitch ear -->
  <g id="antenna-right">
    <path d="M 462,272 L 448,150 L 486,62 L 552,80 L 546,124 L 584,132 L 566,246 L 508,272 Z"
          fill="#8b3ff0" stroke="#4a1a8c" stroke-width="13"/>
    <rect x="546" y="84" width="28" height="28" fill="#7ed321"/>
  </g>

  <!-- crest: pink lightning bolt -->
  <g id="crest">
    <path d="M 380,96 L 330,178 L 368,184 L 326,262 L 412,172 L 372,166 L 418,104 Z"
          fill="#f932c7" stroke="#8c0a77" stroke-width="12"/>
  </g>

  <!-- head + face -->
  <g id="face">
    <path d="M 328,196 C 236,196 152,240 118,318 C 88,386 90,470 122,532 C 160,606 240,660 328,660 C 416,660 496,606 534,532 C 566,470 568,386 538,318 C 504,240 420,196 328,196 Z"
          fill="#8b3ff0" stroke="#4a1a8c" stroke-width="14"/>
    <ellipse cx="238" cy="252" rx="34" ry="14" fill="#c799ef" transform="rotate(-24 238 252)"/>
    <path d="M 328,386 C 316,342 280,328 242,338 C 192,350 154,392 156,446 C 158,528 238,590 328,590 C 418,590 498,528 500,446 C 502,392 464,350 414,338 C 376,328 340,342 328,386 Z"
          fill="#f7effc"/>
    <!-- cheeky brow accent over right eye -->
    <path d="M 428,346 Q 452,338 466,352" fill="none" stroke="#4a1a8c" stroke-width="11"/>
  </g>

  <!-- eyes -->
  <g id="eye-left">
    <g class="eye-core">
      <ellipse cx="240" cy="452" rx="60" ry="66" fill="#ffffff" stroke="#1d073e" stroke-width="11"/>
      <ellipse cx="242" cy="457" rx="48" ry="54" fill="#1d1650"/>
      <path d="M 200,480 A 48 54 0 0 0 284,480 Q 242,514 200,480 Z" fill="#3fd8f5"/>
      <ellipse cx="242" cy="450" rx="25" ry="27" fill="#12082b"/>
      <ellipse class="shine" cx="229" cy="432" rx="14" ry="15" fill="#ffffff"/>
      <ellipse cx="261" cy="474" rx="7" ry="7" fill="#ffffff"/>
    </g>
    <ellipse class="lid" cx="240" cy="452" rx="63" ry="69" fill="#f7effc"/>
    <path class="star-eye" d="M 243,420 L 253,442 L 277,444 L 259,459 L 265,483 L 243,470 L 221,483 L 227,459 L 209,444 L 233,442 Z" fill="#ffd23e" stroke="#8c0a77" stroke-width="5"/>
  </g>
  <g id="eye-right">
    <g class="eye-core">
      <ellipse cx="416" cy="452" rx="60" ry="66" fill="#ffffff" stroke="#1d073e" stroke-width="11"/>
      <ellipse cx="414" cy="457" rx="48" ry="54" fill="#1d1650"/>
      <path d="M 372,480 A 48 54 0 0 0 456,480 Q 414,514 372,480 Z" fill="#3fd8f5"/>
      <ellipse cx="414" cy="450" rx="25" ry="27" fill="#12082b"/>
      <ellipse class="shine" cx="395" cy="432" rx="14" ry="15" fill="#ffffff"/>
      <ellipse cx="427" cy="474" rx="7" ry="7" fill="#ffffff"/>
